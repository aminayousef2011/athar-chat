[project]
name = "athar-chat"
version = "0.1.0"
description = "ATHAR Chat: safe tool routing (ACT / CLARIFY / ABSTAIN) for Egyptian Arabic reminder and alarm requests."
readme = "README.md"
authors = [{ name = "Amina Yousef" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "pydantic>=2.7",
    "tzdata>=2024.1",   # IANA zones for zoneinfo on Windows (Africa/Cairo incl. 2023+ DST)
    "pyyaml>=6.0",
    "psutil>=5.9",      # peak-RSS measurement for the CPU resource log
]

[project.scripts]
athar-data = "athar.data.cli:main"
athar-train = "athar.intent.train:main"
athar-eval = "athar.eval.harness:main"
athar-ood = "athar.eval.ood:main"
athar-v2 = "athar.v2.natural:main"

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
# Exploratory only (Phase 7). Not part of the proposal's core comparison.
jais = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]
neural = [
    "peft>=0.13",
    "sentence-transformers>=3.2",
    "torch>=2.4",
    "transformers>=4.46",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long Arabic lexicon lines are clearer unwrapped

[tool.ruff.lint.per-file-ignores]
# notebooks: imports after the config cell, a trailing expression displays a table, one-line cleanups
"*.ipynb" = ["E402", "E702", "B018"]

[tool.mypy]
python_version = "3.11"
files = ["src/athar"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "scipy.*", "psutil.*", "torch.*", "transformers.*",
          "sentence_transformers.*", "peft.*", "truststore.*", "tokenizers.*", "bitsandbytes.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["athar"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]

# CPU-only PyTorch on every platform (the project runs on CPU; PyPI's Linux wheel pulls CUDA)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
