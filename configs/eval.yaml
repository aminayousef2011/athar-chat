# Pre-registered evaluation settings (docs/evaluation_protocol.md). Hashed into
# models/freeze.json at `athar-train fit`; the locked test run refuses a changed copy.
seed: 20261007
level: 0.95            # two-sided percentile intervals
resamples: 10000       # family-bootstrap resamples
permutations: 10000    # approximate-randomization permutations
alpha: 0.05            # family-wise, Holm-Bonferroni over the comparisons below
calibration_bins: 10
oracle: true           # gold intent + shared core: the extraction/policy ceiling
# primary hypotheses, in this order: H1 S2 > S1, H2 S3 > S1, H3 S3 vs S2
comparisons:
  - [S2, S1]
  - [S3, S1]
  - [S3, S2]
# confidence gate (protocol 6.4, secondary): risk-coverage table at these thresholds; the
# threshold applied on test is the one frozen on dev by `athar-train fit` (configs/train.yaml)
gate:
  thresholds: [0.0, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  max_unsafe_execution_rate: 0.02
perturbations: [taa_marbuta, hamza, alef_maqsura, digits, diacritics, elongation, punctuation,
                politeness, english_trigger]
