# Phase 3: dev-only search and freezing. Hashed into models/freeze.json.
# Selection: highest dev intent macro-F1; ties go to the simpler model (smaller C, then
# shorter n-grams). The chosen settings are refitted on train only.
seed: 0
selection_metric: intent_macro_f1
common:
  class_weight: balanced
  max_iter: 2000
  sublinear_tf: true
  min_df: 1
S2:
  C: [0.1, 0.3, 1, 3, 10, 30]
  word_ngram: [[1, 1], [1, 2]]
S3:
  C: [0.1, 0.3, 1, 3, 10, 30]
  word_ngram: [[1, 1], [1, 2]]
  char_ngram: [[2, 4], [2, 5], [3, 5]]
# Confidence gate (athar.gate), chosen per probabilistic system (S2, S3, S5, S6-s*) on dev after
# the final fit: the smallest threshold whose dev unsafe-execution rate is <= the target (ask as
# rarely as possible); if none reaches it, the one with the lowest rate (ties: smaller). Below
# the threshold an execution becomes a confirmation question. Frozen with the models.
gate:
  thresholds: [0.0, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  max_unsafe_execution_rate: 0.02

# ---- extended baselines (athar-train fit --extended; reported separately from H1-H3) ----
# S5: frozen sentence encoder chosen in advance (multilingual, CPU-sized), pinned revision;
# only C is searched on dev.
S5:
  model: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  prefix: "query: "
  C: [0.1, 0.3, 1, 3, 10, 30]
  max_iter: 2000
# S6: dialectal Arabic encoder fine-tuned with fixed settings (no dev search), 5 seeds,
# small-data recipe (Mosbach et al. 2021): small LR, warm-up, more epochs, grad clipping 1.0.
S6:
  model: UBC-NLP/MARBERTv2
  revision: fe88db9db8ccdb0c4e1627495f405c44a5f89066
  seeds: [0, 1, 2, 3, 4]
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_length: 64
